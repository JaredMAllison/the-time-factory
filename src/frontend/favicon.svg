<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="4" fill="#1a1a2e"/>

  <!-- Bullseye target — lower right -->
  <circle cx="21" cy="21" r="10" fill="#7f1d1d"/>
  <circle cx="21" cy="21" r="7"  fill="#f5f5f5"/>
  <circle cx="21" cy="21" r="4"  fill="#ef4444"/>
  <circle cx="21" cy="21" r="1.5" fill="#f5f5f5"/>

  <!-- String from balloon knot curving down toward target center -->
  <path d="M13 19 Q16 23 21 21" stroke="#cccccc" stroke-width="0.8" fill="none"/>

  <!-- Balloon body -->
  <circle cx="13" cy="11" r="8" fill="#4fc3f7"/>
  <!-- Shine highlight -->
  <circle cx="10" cy="8.5" r="2.2" fill="rgba(255,255,255,0.38)"/>
  <!-- Knot -->
  <polygon points="13,19 11.5,20.8 14.5,20.8" fill="#3a9fc0"/>
</svg>
